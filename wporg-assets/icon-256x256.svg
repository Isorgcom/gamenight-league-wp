<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background: solid GameNight blue with rounded corners -->
  <rect width="256" height="256" rx="40" fill="#2563eb"/>

  <!-- Card-suit glyphs in a 2x2 grid, white -->
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="80" text-anchor="middle" dominant-baseline="central">
    <text x="80" y="84">♠</text>
    <text x="176" y="84" fill="#fca5a5">♥</text>
    <text x="80" y="180" fill="#fca5a5">♦</text>
    <text x="176" y="180">♣</text>
  </g>
</svg>
